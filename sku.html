<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SKU Generator</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            margin: 0;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            background-color: rgb(62, 88, 62);
            color: rgb(0, 0, 0);
        }

        nav {
            height: 60px;
            background-color: rgb(75, 101, 75);
            align-items: center;
            padding-left: 40px;
            gap: 10px;
            font-size: 15px;
            display: flex;
        }

        nav a {
            color: white;
            padding: 17px 22px;
            text-decoration: none;
            font-size: 15px;
        }

        .container {
            width: 75%; 
            max-width: 800px;
            background-color: rgb(194, 235, 194);
            margin: 55px auto;
            border-radius: 15px;
        }

        .header {
            background-color: rgb(136, 169, 136);
            color: white;
            height: 150px;
            padding: 40px;
        }

        .header h1 { 
            margin: 0 0 10px;
            font-size: 35px;
        }

        .header p {
            margin: 0px;
            font-size: 15px;
        }

        .content {
            padding: 35px 45px 45px;
        }

        .content h2 {
            margin-top: 0px;
            font-size: 20px;
        }

        .option {
            width: 100%;
            align-items: center;
            background-color: rgb(209, 226, 209);
            border: 1px solid white;
            border-radius: 5px;
            padding: 15px 18px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        .option input {
            margin-right: 10px;
        }

        .option-left {
            align-items: center;
        }

        button {
            margin-top: 18px;
            padding: 13px 24px;
            border-radius: 7px;
            background-color: rgb(47, 85, 47);
            color: white;
            font-size: 15px;
        }

        .summary {
            margin-top: 20px;
            width: 100%;
            min-height: 125px;
            border: 1px solid white;
            border-radius: 5px;
            padding: 15px;
            background-color: rgb(99, 131, 99);
            text-align: center;
        }

        .field {
            margin-bottom: 22px;
        }

        .field-label {
            display: block;
            margin-bottom: 18px;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            align-items: center;
            background-color: rgb(209, 226, 209);
            border: 1px solid white;
            border-radius: 5px;
            padding: 15px 18px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        .sku-output {
            margin-top: 20px;
            min-height: 50px;
            border: 1px solid white;
            border-radius: 15px;
            background-color: rgb(136, 171, 136);
            font-size: 15px;
            padding: 15px;
        }

        @media(max-width: 700px) {

            .container {
                width: 95%;
                margin: 25px auto;
            }

            .header, 
            .content {
                padding-left: 25px;
                padding-right: 25px;
            }

            nav {
                padding-left: 10px;
            }

            nav a {
                padding: 15px 10px;
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="index.html">Receipt Generator</a>
        <a href="sku.html">SKU Generator</a>
    </nav>

    <div class="container">

        <div class="header">
            <h1>SKU Generator</h1>
        </div>

        <div class="content">
    
            <div class="field">

                <label for="category">
                    Category
                </label>

                <select id="category">
                    <option value="Drinks">
                        Drinks
                    </option>

                    <option value="Snacks">
                        Snacks
                    </option>

                    <option value="Clothes">
                        Clothes
                    </option>

                    <option value="Others">
                        Others
                    </option>
                </select>

            </div>

            <div class="field">
                <label for="product_name">Product Name</label>
                <input type="text" id="product_name" placeholder="Example: Matcha Cookie">
            </div>
    
            <div class="field">

                <label for="quantity">
                    Stock quantity
                </label>

                <input
                    type="number"
                    id="quantity"
                    placeholder="Example: 1000000000"
                >

            </div>


  
            <button onclick="SKU_generator()">
                Generate SKU
            </button>



            <div class="sku-output" id="sku_output"> </div>

        </div>
    </div>


    <script>

        function SKU_generator() {

          
            document.getElementById("sku_output").innerHTML = "";


            let category =
                document.getElementById("category").value;

            let product_name =
                document.getElementById("product_name").value;

            let stock_qty =
                document.getElementById("quantity").value;

            let sku =
                category.slice(0, 3).toUpperCase()
                + "-"
                + product_name.slice(0, 4).toUpperCase()
                + "-"
                + String(stock_qty);


            document.getElementById("sku_output").innerText =
                "SKU: " + sku;

        }

    </script>

</body>
</html>
